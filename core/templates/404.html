<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page introuvable | MD Décor & Plafonds</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        .error-container {
            max-width: 650px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            border-radius: 18px;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 90px;
            line-height: 1;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #d1d5db;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            border-radius: 8px;
            background: white;
            color: #111827;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .phone {
            display: block;
            margin-top: 22px;
            color: #d1d5db;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 70px;
            }

            h2 {
                font-size: 23px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="error-container">

        <div class="logo">
            MD
        </div>

        <h1>404</h1>

        <h2>Page introuvable</h2>

        <p>
            Désolé, la page que vous recherchez n'existe pas
            ou n'est plus disponible.
        </p>

        <a href="/" class="btn">
            Retour à l'accueil
        </a>

        <a href="tel:+221768463146" class="phone">
            📞 76 846 31 46
        </a>

    </main>

</body>
</html>
